version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: delivery-slot-db
    environment:
      POSTGRES_DB: deliveryslot
      POSTGRES_USER: deliveryslot
      POSTGRES_PASSWORD: deliveryslot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deliveryslot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: delivery-slot-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/deliveryslot
      DB_USERNAME: deliveryslot
      DB_PASSWORD: deliveryslot
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
