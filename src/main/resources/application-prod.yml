spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deliveryslot}
    username: ${DB_USERNAME:deliveryslot}
    password: ${DB_PASSWORD:deliveryslot}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

logging:
  level:
    com.walmart.deliveryslot: INFO
