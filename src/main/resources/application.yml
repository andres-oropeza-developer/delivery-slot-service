spring:
  application:
    name: delivery-slot-service
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: Delivery Slot Service API
    description: API para reserva de ventanas de despacho — Walmart Chile
    version: 1.0.0
